name: Deploy gallery upload gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['gallery-worker/**', '.github/workflows/gallery-worker.yml']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check upload gate
        run: node --test gallery-worker/worker.test.mjs
      - name: Deploy gallery Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 68dc5b4dcc1517d612d35b1f93278d58
          workingDirectory: gallery-worker
